<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seven Stories of Hope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single guided track (Looking Back → Up → Ahead) with the ESV passage docked beside the step on wide screens, below it on phones. */
:root{
  --bg:#f6f7f3; --surface:#ffffff; --ink:#1d2533; --muted:#5d6675; --line:#dde1d8;
  --accent:#2f5d62; --accent-soft:#e3eeec; --lamp:#b8791a; --lamp-soft:#f6ecd9;
  --back:#6b5b95; --up:#2f5d62; --ahead:#9a5b1e;
  --f-display:"Young Serif",Georgia,serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --scripture-size:1.12rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --ink:#e7e9e4; --muted:#9aa3b0; --line:#2b333f;
  --accent:#7fb7b0; --accent-soft:#1f3334; --lamp:#e2a94b; --lamp-soft:#33291a;
  --back:#b3a4dd; --up:#7fb7b0; --ahead:#e0a26a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --ink:#e7e9e4; --muted:#9aa3b0; --line:#2b333f;
  --accent:#7fb7b0; --accent-soft:#1f3334; --lamp:#e2a94b; --lamp-soft:#33291a;
  --back:#b3a4dd; --up:#7fb7b0; --ahead:#e0a26a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}

/* home */
.hero{display:grid;gap:10px;margin-block:8px 28px;max-width:720px}
.hero h2{font-size:clamp(1.8rem,4.5vw,2.7rem);line-height:1.15}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.story{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px;display:grid;gap:6px;align-content:start}
.story:hover{border-color:var(--accent)}
.story .num{font-family:var(--f-display);color:var(--lamp);font-size:1.5rem;line-height:1}
.story .t{font-weight:700}
.story .c{color:var(--muted);font-size:.9rem}
.story .r{font-family:var(--f-read);font-size:.92rem;color:var(--accent)}
.story .done{font-size:.75rem;color:var(--muted)}
.custom{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:14px}
.custom label{font-weight:600}
.custom input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.pattern{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.pattern div{display:grid;gap:4px}
.pattern b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.pattern p{margin:0;color:var(--muted);font-size:.93rem}

/* session */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.phase{border:0;background:none;padding:0;text-align:left;display:grid;gap:6px}
.phase .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.phase .bar i{display:block;height:100%;width:0;transition:width .3s}
.phase .lbl{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.phase.on .lbl{color:var(--ink)}
.phase .sym{font-family:var(--f-display);font-size:1rem}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.stage.solo{grid-template-columns:minmax(0,760px)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:16px;min-width:0}
.step .tag{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.step h2{font-size:1.75rem;line-height:1.2}
.say{font-family:var(--f-read);font-size:1.15rem;line-height:1.5;border-left:3px solid var(--lamp);padding-left:14px;margin:0}
.tip{background:var(--lamp-soft);border-radius:8px;padding:12px 14px;font-size:.93rem}
.tip b{display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;color:var(--lamp)}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.93rem}
.field textarea,.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;resize:vertical;min-height:44px}
.field textarea{min-height:72px}
.qs{display:grid;gap:18px;margin:0;padding:0;list-style:none}
.q{display:grid;gap:8px}
.q .qhead{display:flex;gap:10px;align-items:baseline}
.q .ql{text-align:center;font-family:var(--f-display);color:var(--lamp);font-size:1.1rem;flex:none;width:1.2em}
.q .qt{font-weight:600}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-left:1.9em}
.spec .field label{font-size:.85rem}
.spec .field label b{color:var(--lamp);font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.follow{margin:0 0 0 2.2em;padding:0;list-style:none;display:grid;gap:4px;color:var(--muted);font-family:var(--f-read);font-size:1.02rem}
.follow li::before{content:"– ";color:var(--lamp)}
.specbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:600}
.specbox b{color:var(--lamp);font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin-right:1px}
.list{margin:0;padding-left:1.2em;display:grid;gap:4px}
.goals{display:grid;gap:10px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;gap:8px;align-items:start}
.goal input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.goal .x{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:6px}
.goal-head{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:640px){.goal{grid-template-columns:1fr auto}.goal input:nth-child(n+2){grid-column:1/2}.goal-head{display:none}}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-display);font-size:2.4rem;font-variant-numeric:tabular-nums;min-width:4ch}
.timer .who{font-weight:600}

/* scripture */
.scripture{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.stage.solo .scripture{position:static;max-height:none}
.s-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.s-head .ref{font-family:var(--f-display);font-size:1.15rem}
.s-tools{display:flex;gap:6px;align-items:center}
.s-tools button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 9px;font-size:.85rem;font-weight:600}
.s-body{padding:4px 20px 20px;overflow:auto;font-family:var(--f-read);font-size:var(--scripture-size);line-height:1.7}
.s-body h2,.s-body h3{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:700}
.s-body h2.extra_text{display:none}
.s-body p{margin:0 0 .8em}
.s-body .verse-num,.s-body .chapter-num{font-family:var(--f-ui);font-size:.62em;color:var(--lamp);font-weight:700;vertical-align:super;margin-right:2px}
.s-body .copyright{font-size:.8rem}
.s-body audio{width:100%;margin-top:14px}
.s-body.hidden-text > :not(.cover){filter:blur(7px);user-select:none;pointer-events:none}
.cover{position:sticky;top:12px;z-index:2;margin:14px 0;background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-family:var(--f-ui);font-size:.92rem}
.lookup{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line)}
.lookup input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:.9rem}
.notice{font-family:var(--f-ui);font-size:.95rem;display:grid;gap:10px;padding-top:16px}
.loading{font-family:var(--f-ui);color:var(--muted);padding-top:16px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.nav-in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav .count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* settings */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:10}
.sheet-in{background:var(--surface);border-radius:12px;padding:22px;max-width:480px;width:100%;display:grid;gap:14px;border:1px solid var(--line)}
.sheet-in h3{font-size:1.3rem}
.sheet-in p{margin:0;font-size:.93rem}

.summary{white-space:pre-wrap;font-family:var(--f-ui);font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:320px;overflow:auto}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.scripture{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Seven Stories of Hope</h1>
      <span class="muted" style="font-size:.9rem">Discovery Bible Study · SWORD method</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" id="homeBtn" hidden>All stories</button>
      <button class="btn ghost" id="settingsBtn">ESV settings</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<nav class="nav" id="nav" hidden>
  <div class="nav-in">
    <button class="btn" id="prevBtn">← Back</button>
    <span class="count" id="count"></span>
    <button class="btn primary" id="nextBtn">Next →</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">ESV Bible connection</h3>
    <p>Passages load live from the ESV API. Paste an API key from <a href="https://api.esv.org/account/create-application/" target="_blank" rel="noopener">api.esv.org</a> (free for non-commercial ministry use). It's saved only in this browser.</p>
    <div class="field">
      <label for="keyInput">API key</label>
      <input id="keyInput" type="password" autocomplete="off" placeholder="e.g. 3f2a…">
    </div>
    <p class="muted" id="keyStatus"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn ghost" id="clearKey">Remove key</button>
      <button class="btn ghost" id="closeSheet">Cancel</button>
      <button class="btn primary" id="saveKey">Save</button>
    </div>
  </div>
</div>

<script>
/* ---- Setup: to let your whole group use the app without their own key,
   paste your ESV API key here before hosting. Note: anyone who views the
   page source can see it, so use a key made for this app only. ---- */
/*const ESV_API_KEY = "https://api.esv.org/v3/passage/text/";*/
const ESV_API_KEY = 'ccbf0a4b9f501f9c1e71052941583c219e9c85ce';
const API_URL = 'https://api.esv.org/v3/passage/text/';
  
const STORIES = [
  {id:"s1", title:"Hope for the Rejected", who:"The Sinful Woman", ref:"Luke 7:36-50"},
  {id:"s2", title:"Hope for the Non-Religious", who:"The Pharisee & the Tax Collector", ref:"Luke 18:9-17"},
  {id:"s3", title:"Hope Changes Things", who:"Zacchaeus", ref:"Luke 19:1-10"},
  {id:"s4", title:"Hope Forgives", who:"The Unforgiving Servant", ref:"Matthew 18:21-35"},
  {id:"s5", title:"Hope Through Death", who:"The Thieves on the Cross", ref:"Luke 23:26-43"},
  {id:"s6", title:"Hope Rose from the Dead", who:"The Resurrection", ref:"Luke 24:1-20"},
  {id:"s7", title:"Hope Is Waiting for You", who:"The Prodigal Son", ref:"Luke 15:11-32"}
];

const PHASES = [
  {key:"back", sym:"<", name:"Looking Back"},
  {key:"up", sym:"^", name:"Looking Up"},
  {key:"ahead", sym:">", name:"Looking Ahead"}
];

const STEPS = [
  {id:"care", phase:"back", title:"Care", passage:false},
  {id:"account", phase:"back", title:"Accountability", passage:false},
  {id:"tell", phase:"up", title:"Tell the story", passage:"hidden"},
  {id:"retell", phase:"up", title:"Retell the story together", passage:"hidden"},
  {id:"read", phase:"up", title:"Read the story", passage:"open"},
  {id:"discuss", phase:"up", title:"Discuss the story", passage:"open"},
  {id:"practice", phase:"up", title:"Practice", passage:"hidden"},
  {id:"goals", phase:"ahead", title:"Set Grow & Go goals", passage:false},
  {id:"pray", phase:"ahead", title:"Pray", passage:false},
  {id:"wrap", phase:"ahead", title:"Wrap up", passage:false}
];

/* ---------- storage (per-browser convenience only) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let memKey = null;
function apiKey(){ return memKey || store.get("dbs.key","") || ESV_API_KEY; }

/* ---------- state ---------- */
const state = { story:null, step:0, revealed:false, fontScale:store.get("dbs.font",1) };
document.documentElement.style.setProperty("--scripture-size", (1.12*state.fontScale)+"rem");

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esvLink = ref => "https://www.esv.org/" + encodeURIComponent(ref.replace(/\s+/g,"+")).replace(/%2B/g,"+") + "/";

/* ---------- home ---------- */
function renderHome(){
  state.story = null;
  $("#nav").hidden = true; $("#homeBtn").hidden = true;
  const done = store.get("dbs.done", {});
  app.innerHTML = `
    <section class="hero">
      <span class="eyebrow">Discovering the Bible together</span>
      <h2>Pick a story. The app walks your group through it, step by step.</h2>
      <p>Anyone can lead with this. Open it on one phone or screen, tap through each step, and read the questions out loud. The ESV text appears when you need it.</p>
    </section>
    <div class="stories">
      ${STORIES.map((s,i)=>`
        <button class="story" data-id="${s.id}">
          <span class="num">${i+1}</span>
          <span class="t">${esc(s.title)}</span>
          <span class="c">${esc(s.who)}</span>
          <span class="r">${esc(s.ref)}</span>
          ${done[s.id] ? `<span class="done">Last led ${esc(done[s.id])}</span>` : ""}
        </button>`).join("")}
    </div>
    <form class="custom" id="customForm">
      <label for="customRef">Or study any passage</label>
      <input id="customRef" placeholder="e.g. John 4:1-26" autocomplete="off">
      <button class="btn primary" type="submit">Start</button>
    </form>
    <section class="pattern" aria-label="The pattern">
      <div><span class="eyebrow">&lt; Looking Back</span><b>Care & accountability</b><p>How is everyone doing? How did you obey Jesus, and who did you share the story with?</p></div>
      <div><span class="eyebrow">^ Looking Up</span><b>Tell, retell, read, discuss</b><p>Hear the story from memory, rebuild it together, read it, and discuss it with the SWORD questions. Then practice telling it.</p></div>
      <div><span class="eyebrow">&gt; Looking Ahead</span><b>Grow, go, pray</b><p>Each person names one thing to obey and one person to tell this week. Then pray.</p></div>
    </section>`;
  app.querySelectorAll(".story").forEach(b => b.onclick = () => startStory(STORIES.find(s=>s.id===b.dataset.id)));
  $("#customForm").onsubmit = e => {
    e.preventDefault();
    const ref = $("#customRef").value.trim(); if(!ref) return;
    startStory({id:"c-"+ref.toLowerCase().replace(/[^a-z0-9]+/g,"-"), title:ref, who:"Custom passage", ref});
  };
  window.scrollTo(0,0);
}

function startStory(s){
  state.story = s; state.step = 0; state.revealed = false;
  $("#homeBtn").hidden = false; $("#nav").hidden = false;
  renderStep(); fetchPassage(s.ref);
}

/* ---------- guide content ---------- */
const ask = (letter, text, follow) => `
  <li class="q"><div class="qhead"><span class="ql">${letter}</span><span class="qt">${text}</span></div>
  ${follow && follow.length ? `<ul class="follow">${follow.map(f=>`<li>${f}</li>`).join("")}</ul>` : ""}</li>`;
const tip = (t, label) => `<div class="tip"><b>${label||"Leader tip"}</b>${t}</div>`;

function stepBody(st){
  const s = state.story;
  switch(st.id){
    case "care": return `
      <p class="say">"How are you doing this week?"</p>
      <p>Go around the circle. Give each person a chance to briefly share how they're doing, and listen well.</p>
      <ol class="qs">
        ${ask("?","If someone shares something hard, ask:",["\"How can we pray for you tonight?\""])}
      </ol>
      ${tip("Keep this short so there's time for the story. Remember the needs people share so you can pray for them at the end.")}`;
    case "account": return `
      <ol class="qs">
        ${ask("↑","Grow: \"How did you obey Jesus last week?\"",["\"What happened when you did?\"","\"What made it hard?\""])}
        ${ask("→","Go: \"Who did you share the story with last week?\"",["\"How did they respond?\"","\"Do they want to hear another story?\""])}
      </ol>
      ${tip("If this is your first time meeting, explain that each week everyone will pick one thing to obey and one person to tell. Next week you'll ask how it went.")}
      ${tip("If someone didn't follow through, keep it grace-filled. Encourage them to try again this week.","If someone didn't")}`;
    case "tell": return `
      <p>One person tells <b>${esc(s.ref)}</b> from memory, as a story. No Bibles open yet.</p>
      <p class="say">"Let me tell you a story from the Bible…"</p>
      ${tip("Tell it simply and accurately, in your own words. It's fine to peek at the passage beforehand, then hide it again while you tell.")}`;
    case "retell": return `
      <p>Now the group rebuilds the story together, from memory.</p>
      <ol class="qs">
        ${ask("?","Ask the group:",["\"How does the story start?\"","\"What happened next?\"","\"Who was there? What did they say?\"","\"How does it end?\""])}
      </ol>
      ${tip("Let the group do the work. When they miss a detail, ask a question instead of correcting. Anyone can jump in and fill in gaps.")}`;
    case "read": return `
      <p>Read <b>${esc(s.ref)}</b> together from the Bible. Take turns reading aloud, or play the audio.</p>
      <p class="say">"As we read, listen for anything we left out when we retold it."</p>
      <ol class="qs">
        ${ask("?","After reading, ask:",["\"What did we leave out?\"","\"Did anything surprise you?\""])}
      </ol>`;
    case "discuss": return `
      <ol class="qs">
        ${ask("a","What do we learn about God / Jesus?",["\"What did Jesus say or do?\"","\"What does that show us about him?\""])}
        ${ask("b","What do we learn from the people in this story?",["\"Why do you think they acted that way?\"","\"How did they respond to Jesus?\""])}
        <li class="q"><div class="qhead"><span class="ql">c</span><span class="qt">Is there a…</span></div>
          <div class="spec">
            <div class="specbox"><b>S</b>in to avoid?</div>
            <div class="specbox"><b>P</b>romise to claim?</div>
            <div class="specbox"><b>E</b>xample to follow?</div>
            <div class="specbox"><b>C</b>ommand to obey?</div>
          </div></li>
        ${ask("d","Who do you most identify with in the story, and why?")}
        ${ask("e","Invite: \"What keeps you from following Jesus today?\"")}
      </ol>
      ${tip("After someone answers, ask \"Where do you see that in the story?\" Let the Bible be the authority, not the leader.")}
      ${tip("Resist the urge to teach. If someone says something off, send the group back to the passage: \"What does the story say about that?\"","When answers wander")}`;
    case "practice": return `
      <p>Pair up. Each person tells the story to their partner, then switch. The passage is hidden again so you tell it from memory.</p>
      <div class="timer" aria-live="polite">
        <span class="clock" id="clock">3:00</span>
        <span class="who" id="who">Partner 1</span>
        <button class="btn primary" id="tStart">Start</button>
        <button class="btn" id="tSwitch">Switch</button>
        <button class="btn ghost" id="tReset">Reset</button>
      </div>
      ${tip("The goal is that everyone leaves able to tell this story to someone this week. Partners can help each other with parts they forgot.")}`;
    case "goals": return `
      <p>Go around the circle. Each person answers both questions out loud.</p>
      <ol class="qs">
        ${ask("↑","Grow: \"What from the story is Jesus asking you to obey this week?\"",["Help people make it specific: \"I will ___ this week.\""])}
        ${ask("→","Go: \"Who is someone in your life who needs to hear this story?\"",["Ask for a name, not a category: \"I will tell ___.\""])}
      </ol>
      ${tip("Encourage people to remember each other's answers. You'll ask about them next week during Looking Back.")}`;
    case "pray": return `
      <p>Pray for one another.</p>
      <ul class="list">
        <li>For the needs people shared at the start</li>
        <li>For courage to obey what Jesus showed each person tonight</li>
        <li>By name, for the people each person plans to tell</li>
      </ul>
      ${tip("Invite anyone to pray, even a sentence. For new believers or not-yet-believers, you might pray for them rather than asking them to pray aloud.")}`;
    case "wrap": return `
      <p>You're done. Before everyone leaves:</p>
      <ul class="list">
        <li>Agree on when and where you'll meet next</li>
        <li>Next time, start again at Looking Back and ask how the Grow & Go goals went</li>
        ${nextStory() ? `<li>Next story: <b>${esc(nextStory().title)}</b> (${esc(nextStory().ref)})</li>` : ""}
      </ul>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${nextStory() ? `<button class="btn" id="nextStory">Preview the next story</button>` : ""}
      </div>`;
  }
}

function nextStory(){ const i = STORIES.findIndex(s=>s.id===state.story.id); return i>=0 && i<STORIES.length-1 ? STORIES[i+1] : null; }

/* ---------- render step ---------- */
function renderStep(){
  const st = STEPS[state.step], s = state.story;
  const phaseIdx = PHASES.findIndex(p=>p.key===st.phase);
  const inPhase = STEPS.filter(x=>x.phase===st.phase);
  const posInPhase = inPhase.indexOf(st)+1;
  const color = `var(--${st.phase})`;
  const showPassage = !!st.passage;
  if(st.passage !== "hidden") state.revealed = false;

  app.innerHTML = `
    <div class="phases">
      ${PHASES.map((p,i)=>{
        const steps = STEPS.filter(x=>x.phase===p.key);
        const pct = i<phaseIdx ? 100 : i>phaseIdx ? 0 : Math.round(posInPhase/steps.length*100);
        return `<button class="phase ${i===phaseIdx?"on":""}" data-p="${p.key}">
          <span class="bar"><i style="width:${pct}%;background:var(--${p.key})"></i></span>
          <span class="lbl"><span class="sym" style="color:var(--${p.key})">${esc(p.sym)}</span>${p.name}</span></button>`;
      }).join("")}
    </div>
    <div class="stage ${showPassage?"":"solo"}">
      <section class="step">
        <span class="tag" style="color:${color}">${esc(PHASES[phaseIdx].sym)} ${PHASES[phaseIdx].name} · ${esc(s.title)}</span>
        <h2>${st.title}</h2>
        ${stepBody(st)}
      </section>
      ${showPassage ? `<aside class="scripture" aria-label="Scripture">
        <div class="s-head">
          <span class="ref" id="sRef">${esc(s.ref)}</span>
          <span class="s-tools">
            <button id="fDown" aria-label="Smaller text">A−</button>
            <button id="fUp" aria-label="Larger text">A+</button>
          </span>
        </div>
        <div class="s-body" id="sBody"></div>
        <form class="lookup" id="lookup"><input id="lookupRef" placeholder="Look up another passage" aria-label="Look up another passage"><button class="btn" type="submit">Go</button></form>
      </aside>` : ""}
    </div>`;

  $("#count").textContent = `Step ${state.step+1} of ${STEPS.length}`;
  $("#prevBtn").disabled = state.step===0;
  $("#nextBtn").textContent = state.step===STEPS.length-1 ? "Finish" : "Next →";

  wireStep(st);
  if(showPassage){ passageView.ref = s.ref; paintPassage(); }
}

function wireStep(st){
  app.querySelectorAll(".phase").forEach(b => b.onclick = () => { state.step = STEPS.findIndex(x=>x.phase===b.dataset.p); renderStep(); window.scrollTo(0,0); });
  if(st.id==="practice") wireTimer();
  if(st.id==="wrap"){ const ns = $("#nextStory"); if(ns) ns.onclick = () => startStory(nextStory()); }
  const fd = $("#fDown"), fu = $("#fUp");
  if(fd){ fd.onclick = () => setFont(-0.1); fu.onclick = () => setFont(0.1); }
  const lk = $("#lookup");
  if(lk) lk.onsubmit = e => { e.preventDefault(); const r = $("#lookupRef").value.trim(); if(r){ passageView.ref = r; state.revealed = true; $("#sRef").textContent = r; fetchPassage(r); paintPassage(); } };
}

function setFont(d){
  state.fontScale = Math.min(1.6, Math.max(0.8, +(state.fontScale+d).toFixed(2)));
  store.set("dbs.font", state.fontScale);
  document.documentElement.style.setProperty("--scripture-size", (1.12*state.fontScale)+"rem");
}

/* ---------- practice timer ---------- */
let timer = {left:180, run:null, who:1};
function wireTimer(){
  const paint = () => { const m = Math.floor(timer.left/60), s = timer.left%60; $("#clock").textContent = `${m}:${String(s).padStart(2,"0")}`; $("#who").textContent = "Partner "+timer.who; $("#tStart").textContent = timer.run ? "Pause" : "Start"; };
  const stop = () => { clearInterval(timer.run); timer.run = null; };
  $("#tStart").onclick = () => { if(timer.run){ stop(); } else { timer.run = setInterval(()=>{ timer.left--; if(timer.left<=0){ timer.left=0; stop(); } if($("#clock")) paint(); else stop(); },1000); } paint(); };
  $("#tSwitch").onclick = () => { stop(); timer.who = timer.who===1?2:1; timer.left = 180; paint(); };
  $("#tReset").onclick = () => { stop(); timer = {left:180, run:null, who:1}; paint(); };
  paint();
}

/* ---------- ESV passage ---------- */
const cache = {};
const passageView = { ref:null };

async function fetchPassage(ref){
  if(cache[ref] && cache[ref].status !== "error") return;
  const key = apiKey();
  if(!key){ cache[ref] = {status:"nokey"}; paintPassage(); return; }
  cache[ref] = {status:"loading"}; paintPassage();
  const params = new URLSearchParams({
    q: ref, "include-passage-references":"true", "include-footnotes":"false",
    "include-headings":"true", "include-audio-link":"true", "include-short-copyright":"true",
    "include-first-verse-numbers":"true"
  });
  try{
    const res = await fetch("https://api.esv.org/v3/passage/html/?"+params, {headers:{Authorization:"Token "+key}});
    if(res.status===401 || res.status===403){ cache[ref] = {status:"badkey"}; }
    else if(!res.ok){ cache[ref] = {status:"error", msg:"The ESV server returned an error ("+res.status+")."}; }
    else {
      const data = await res.json();
      if(!data.passages || !data.passages.length){ cache[ref] = {status:"notfound"}; }
      else cache[ref] = {status:"ok", html:data.passages.join(""), canonical:data.canonical};
    }
  }catch(e){
    cache[ref] = {status:"error", msg:"This page couldn't reach the ESV server. If you're viewing it inside Claude, host the file on your own site (see setup notes) and passages will load."};
  }
  paintPassage();
}

function cleanPassage(html){
  const t = document.createElement("template"); t.innerHTML = html;
  t.content.querySelectorAll("script,iframe,object,embed").forEach(n=>n.remove());
  let audio = "";
  const a = t.content.querySelector("a.mp3link");
  if(a){ audio = a.getAttribute("href"); const sm = a.closest("small"); if(sm) sm.remove(); }
  t.content.querySelectorAll("a").forEach(x=>{ x.target="_blank"; x.rel="noopener"; });
  const div = document.createElement("div"); div.appendChild(t.content);
  return {html: div.innerHTML, audio};
}

function paintPassage(){
  const body = $("#sBody"); if(!body || !passageView.ref) return;
  const ref = passageView.ref, c = cache[ref] || {status:"loading"};
  const st = STEPS[state.step];
  const link = `<a href="${esvLink(ref)}" target="_blank" rel="noopener">Read ${esc(ref)} on esv.org</a>`;
  let inner = "";
  if(c.status==="loading") inner = `<p class="loading">Loading ${esc(ref)}…</p>`;
  else if(c.status==="nokey") inner = `<div class="notice"><b>Connect the ESV Bible</b><span>Add an ESV API key to show the passage here.</span><span><button class="btn primary" data-open-settings>Add API key</button></span><span>${link}</span></div>`;
  else if(c.status==="badkey") inner = `<div class="notice"><b>The ESV API key didn't work</b><span>Check the key in ESV settings and try again.</span><span><button class="btn" data-open-settings>ESV settings</button></span><span>${link}</span></div>`;
  else if(c.status==="notfound") inner = `<div class="notice"><b>No passage found for "${esc(ref)}"</b><span>Try a reference like "Luke 15:11-32".</span></div>`;
  else if(c.status==="error") inner = `<div class="notice"><b>Passage didn't load</b><span>${esc(c.msg)}</span><span><button class="btn" data-retry>Try again</button></span><span>${link}</span></div>`;
  else {
    const p = cleanPassage(c.html);
    inner = p.html + (p.audio ? `<audio controls preload="none" src="${esc(p.audio)}"></audio><p style="font-family:var(--f-ui);font-size:.8rem"><a href="${esc(p.audio)}" target="_blank" rel="noopener">Open audio in a new tab</a></p>` : "");
  }
  const hide = st.passage==="hidden" && !state.revealed && c.status==="ok" && ref===state.story.ref;
  body.classList.toggle("hidden-text", hide);
  body.innerHTML = (hide ? `<div class="cover"><span>Hidden so the group tells it from memory.</span><button class="btn" id="peek">Show passage</button></div>` : "") + inner;
  const pk = $("#peek"); if(pk) pk.onclick = () => { state.revealed = true; paintPassage(); };
  body.querySelectorAll("[data-open-settings]").forEach(b=>b.onclick = openSettings);
  const rt = body.querySelector("[data-retry]"); if(rt) rt.onclick = () => { delete cache[ref]; fetchPassage(ref); };
}

/* ---------- settings ---------- */
function openSettings(){
  $("#keyInput").value = store.get("dbs.key","") || memKey || "";
  $("#keyStatus").textContent = ESV_API_KEY ? "A shared key is built into this page. A key you add here overrides it on this device." : "";
  $("#sheet").hidden = false; $("#keyInput").focus();
}
function closeSettings(){ $("#sheet").hidden = true; }
function resetPassages(){ Object.keys(cache).forEach(k=>delete cache[k]); if(state.story){ fetchPassage(state.story.ref); if(passageView.ref && passageView.ref!==state.story.ref) fetchPassage(passageView.ref); } }
$("#settingsBtn").onclick = openSettings;
$("#closeSheet").onclick = closeSettings;
$("#saveKey").onclick = () => { const k = $("#keyInput").value.trim(); memKey = k || null; store.set("dbs.key", k); closeSettings(); resetPassages(); };
$("#clearKey").onclick = () => { memKey = null; store.set("dbs.key",""); $("#keyInput").value=""; closeSettings(); resetPassages(); };
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") closeSettings(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#sheet").hidden) closeSettings(); });

/* ---------- nav ---------- */
$("#prevBtn").onclick = () => { if(state.step>0){ state.step--; renderStep(); window.scrollTo(0,0); } };
$("#nextBtn").onclick = () => {
  if(state.step < STEPS.length-1){ state.step++; renderStep(); window.scrollTo(0,0); }
  else { const d = store.get("dbs.done",{}); d[state.story.id] = new Date().toLocaleDateString(); store.set("dbs.done", d); renderHome(); }
};
$("#homeBtn").onclick = renderHome;

renderHome();
</script>

</body>
</html>
